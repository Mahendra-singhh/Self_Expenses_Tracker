<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="sigin">
  <h2>Signup</h2>

  {% with messages = get_flashed_messages(with_categories=True) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="signdata">
    <form method="POST" action="/signin">
      
      <!-- Role Selector -->
      <div class="form-group mb-3">
        <label class="form-label fw-bold">Select Role:</label>
        <div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="role" id="roleOwner" value="owner" checked>
            <label class="form-check-label" for="roleOwner">Owner</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="role" id="roleStaff" value="employee">
            <label class="form-check-label" for="roleStaff">Staff</label>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="" class="mt-2">Username</label>
        <input type="username" name="username" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required>


        <label for="exampleInputEmail1" class="mt-2">Email address</label>
        <input type="email" name="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required>

        <label for="exampleInputpassword" class="mt-2">Password</label>
        <input type="password" name="password" class="form-control" id="exampleInputpassword" required>
      </div>
      
      <button type="submit" class="btn btn-primary mt-3">Create Account</button>
    </form>

    <div class="no-style mt-3">
      <a href="{{ url_for('login') }}">Already registered? Return to Login</a>
    </div>
  </div>
</div>

</body>
</html>
